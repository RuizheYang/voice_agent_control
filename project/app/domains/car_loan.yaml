workflow_id: car_loan
name: 汽车金融低息车贷线
version: "v1.0"
domain_description: "负责购车分期贷款方案测算、首付比例规划、月供评估与金融专员对接"

voice_agent_id: default
strategy_id: default

evaluation_mode: single_pass
work_start_time: "09:00:00"
work_end_time: "21:00:00"

in_call_flow:
  initial_node: loan_consultation
  nodes:
    loan_consultation:
      role_message: "你是汽车金融车贷专员，解答首付比例、低息利率与月供问题，可实时调用 tool_calc_loan_plan 测算方案。"
      functions:
        - tool_calc_loan_plan
      transitions:
        - condition: "客户明确表示改为全款购车不需要分期"
          action: "handoff"
          target_workflow: "new_car_sales"

enabled_sub_evaluators:
  - intent
  - objection
  - appointment
  - sentiment

custom_evaluators:
  - name: loan_qualification
    prompt: "判断客户是否提及稳定收入或社保公积金、预期首付比例、可接受月供区间及征信顾虑"
    output_fields:
      has_stable_income: "bool"
      expected_down_payment: "str"
      credit_concern: "str"

domain_master_prompt: |
  本业务线核心目标是解答车贷利率与首付疑问，并引导客户同意添加汽车金融专员微信发送专属分期方案。
  若客户明确改口决定“全款购车不需要分期”，请建议 handoff 回 new_car_sales 业务线。

declarative_http_tools:
  - name: tool_calc_loan_plan
    description: "根据车辆总价和首付比例实时测算汽车金融分期月供方案"
    method: POST
    url: "https://internal-finance.example.com/api/loan/simulate"
    credential_ref: "finance_api_token"
    timeout_seconds: 2.0
    parameters:
      car_price_wan:
        type: "float"
        description: "车辆总价(万元)"
        required: true
      down_payment_ratio:
        type: "float"
        description: "首付比例(0.1至0.8)"
        required: true
      months:
        type: "int"
        description: "分期期数(12/24/36/60)"
        required: true

allowed_tools:
  - tool_schedule_followup
  - tool_set_wakeup_timer
  - tool_terminate_clue
  - tool_trigger_channel_action
  - tool_handoff_workflow
  - tool_calc_loan_plan

allowed_handoff_targets:
  - new_car_sales
max_handoffs: 2
max_touches_per_24h: 5
