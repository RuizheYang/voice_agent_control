<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent Control - 调度与外呼大盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body class="bg-gray-50 p-8 font-sans text-gray-800">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 space-y-4 md:space-y-0">
            <h1 class="text-3xl font-bold text-gray-800 border-l-4 border-blue-500 pl-4">Agent 驱动外呼与调度分析大盘</h1>
            <div class="flex items-center space-x-3 bg-white p-2 rounded-lg shadow-sm border border-gray-200">
                <span class="text-gray-500 font-medium px-2">时间范围:</span>
                <input type="date" id="start_date" class="border border-gray-300 rounded px-3 py-1.5 text-sm">
                <span class="text-gray-400">-</span>
                <input type="date" id="end_date" class="border border-gray-300 rounded px-3 py-1.5 text-sm">
                <button onclick="fetchData()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-1.5 px-5 rounded shadow text-sm">查询</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">总流入线索</h3>
                <div class="text-3xl font-bold text-gray-900 mt-2" id="total_clues">--</div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">总外呼次数</h3>
                <div class="text-3xl font-bold text-blue-600 mt-2" id="total_calls">--</div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">已接通外呼</h3>
                <div class="text-3xl font-bold text-emerald-600 mt-2" id="answered_calls">--</div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Inbox 待消费事件</h3>
                <div class="text-3xl font-bold text-amber-600 mt-2" id="inbox_pending">--</div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">待触发认知闹钟</h3>
                <div class="text-3xl font-bold text-indigo-600 mt-2" id="wakeup_pending">--</div>
            </div>
        </div>

        <div class="mb-4">
            <h2 class="text-xl font-bold text-gray-800">每日外呼与转化趋势</h2>
            <p class="text-sm text-gray-400 mt-1" id="chart_subtitle">当前展示范围：...</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <h3 class="font-bold text-gray-700 mb-2">线索流入与接通趋势</h3>
                <div id="chart_calls" style="width: 100%; height: 280px;"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <h3 class="font-bold text-gray-700 mb-2">终态达成与结束分布</h3>
                <div id="chart_outcomes" style="width: 100%; height: 280px;"></div>
            </div>
        </div>
    </div>

    <script>
        let charts = {};
        function initDates() {
            const today = new Date();
            const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            const fmt = (d) => d.toISOString().split('T')[0];
            document.getElementById('end_date').value = fmt(today);
            document.getElementById('start_date').value = fmt(sevenDaysAgo);
        }
        function initCharts() {
            charts.calls = echarts.init(document.getElementById('chart_calls'));
            charts.outcomes = echarts.init(document.getElementById('chart_outcomes'));
        }
        async function fetchData() {
            const startDate = document.getElementById('start_date').value;
            const endDate = document.getElementById('end_date').value;
            const resp = await fetch(`/api/analytics/dashboard-stats?start_date=${startDate}&end_date=${endDate}`);
            const result = await resp.json();
            if (result.code === 0 && result.data) {
                const d = result.data;
                document.getElementById('total_clues').innerText = d.total_clues;
                document.getElementById('total_calls').innerText = d.total_calls;
                document.getElementById('answered_calls').innerText = d.answered_calls;
                document.getElementById('inbox_pending').innerText = d.inbox_pending;
                document.getElementById('wakeup_pending').innerText = d.wakeup_pending;
                document.getElementById('chart_subtitle').innerText = `统计范围：${d.date_range}`;
                const trend = d.daily_trend || [];
                const dates = trend.map(i => i.date);
                charts.calls.setOption({
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['新增线索', '总外呼', '已接通'] },
                    xAxis: { type: 'category', data: dates },
                    yAxis: { type: 'value' },
                    series: [
                        { name: '新增线索', type: 'line', smooth: true, data: trend.map(i => i.new_clues) },
                        { name: '总外呼', type: 'bar', data: trend.map(i => i.calls) },
                        { name: '已接通', type: 'line', smooth: true, data: trend.map(i => i.answered_calls) }
                    ]
                });
                charts.outcomes.setOption({
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['达成结案', '淘汰终止'] },
                    xAxis: { type: 'category', data: dates },
                    yAxis: { type: 'value' },
                    series: [
                        { name: '达成结案', type: 'bar', data: trend.map(i => i.accepted) },
                        { name: '淘汰终止', type: 'bar', data: trend.map(i => i.rejected) }
                    ]
                });
            }
        }
        window.onload = () => { initDates(); initCharts(); fetchData(); };
    </script>
</body>
</html>
