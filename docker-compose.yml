services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env.example
    environment:
      ENV: dev
      DATABASE_URL: sqlite://dbfiles/voice_agent_hub.db
      REDIS_URL: redis://redis:6379/0
      TELEPHONY_GATEWAY_MODE: mock
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./project/dbfiles:/app/dbfiles
      - ./project/logs:/app/logs
